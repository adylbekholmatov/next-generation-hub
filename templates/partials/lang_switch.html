{% load i18n %}{% get_current_language as LANGUAGE_CODE %}{% get_available_languages as LANGUAGES %}<div class="lang-switch" role="group" aria-label="{% trans 'Language' %}">
  <form action="{% url 'set_language' %}" method="post">{% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    {% for code, name in LANGUAGES %}<button type="submit" name="language" value="{{ code }}" lang="{{ code }}" title="{{ name }}" aria-label="{{ name }}"{% if code == LANGUAGE_CODE %} aria-current="true"{% endif %}>{{ code|upper }}</button>{% endfor %}
  </form>
</div>
