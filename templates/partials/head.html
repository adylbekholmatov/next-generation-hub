{% load static i18n %}<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f8ff">
<meta name="color-scheme" content="light dark">
<script>
  /* Тема ставится до отрисовки, чтобы не было мигания. По умолчанию — светлая. */
  (function () {
    var d = document.documentElement, t = null;
    try { t = localStorage.getItem("ngh-theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") t = "light";
    d.setAttribute("data-theme", t);
    d.classList.remove("no-js");
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap">
<link rel="stylesheet" href="{% static 'css/main.css' %}">
<link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
